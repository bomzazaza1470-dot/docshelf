<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DocShelf · ชั้นเอกสาร</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233d5af1'/%3E%3Crect x='14' y='14' width='8' height='30' rx='2' fill='%23fff'/%3E%3Crect x='26' y='10' width='8' height='34' rx='2' fill='%2314b8a6'/%3E%3Crect x='38' y='18' width='12' height='26' rx='2' fill='%23fff'/%3E%3Crect x='10' y='48' width='44' height='4' rx='2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ee;--card:#fff;--tx:#1b1a17;--mut:#7a776e;--ac:#3d5af1;--ac2:#14b8a6;--soft:#e9edff;--bd:#e7e4db;--sh:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(40,30,10,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#201f1d;--tx:#f1efe8;--mut:#9b988e;--ac:#8da2ff;--ac2:#4fd1c5;--soft:#1f2440;--bd:#33312d;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#141413;--card:#201f1d;--tx:#f1efe8;--mut:#9b988e;--ac:#8da2ff;--ac2:#4fd1c5;--soft:#1f2440;--bd:#33312d;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:980px;margin:0 auto;padding:32px 18px 64px}
header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-weight:700;font-size:.8rem;box-shadow:var(--sh)}
h1{font-size:1.55rem;line-height:1.2;margin:0}
.sub{color:var(--mut);font-size:.92rem;margin:2px 0 0}
.stats{display:flex;gap:10px;margin:0 0 18px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 16px;box-shadow:var(--sh)}
.stat b{display:block;font-size:1.2rem}
.stat span{color:var(--mut);font-size:.78rem}
#drop{position:relative;border:2px dashed var(--bd);border-radius:18px;padding:30px 20px;text-align:center;background:var(--card);cursor:pointer;transition:.18s;box-shadow:var(--sh)}
#drop:hover,#drop.over{border-color:var(--ac);background:var(--soft)}
#drop .up{width:52px;height:52px;margin:0 auto 10px;border-radius:50%;background:var(--soft);color:var(--ac);display:grid;place-items:center;font-size:1.5rem}
#drop b{font-size:1.05rem}
#drop small{display:block;color:var(--mut);margin-top:4px}
#file{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
#bar2{height:4px;border-radius:4px;background:var(--bd);margin-top:12px;overflow:hidden;display:none}
#bar2 i{display:block;height:100%;width:35%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:4px;animation:slide 1s infinite ease-in-out}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
.tools{display:flex;gap:10px;margin:22px 0 14px;flex-wrap:wrap}
.tools input,.tools select{font:inherit;padding:11px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.tools input{flex:1;min-width:180px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px;transition:transform .15s}
.item:hover{transform:translateY(-2px)}
.top{display:flex;gap:12px;align-items:center}
.ico{flex:none;width:44px;height:52px;border-radius:8px;background:linear-gradient(160deg,var(--ac),var(--ac2));color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:end center;padding-bottom:7px;position:relative}
.ico:after{content:"";position:absolute;left:10px;right:10px;top:22px;height:14px;background:repeating-linear-gradient(#fff 0 2px,transparent 2px 6px);opacity:.85;border-radius:1px}
.ico:before{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 12px 12px 0;border-color:transparent var(--card) rgba(0,0,0,.18) transparent;border-radius:0 8px 0 0}
.info{min-width:0;flex:1}
.name{font-weight:600;font-size:.95rem;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:.78rem;color:var(--mut)}
.acts{display:flex;gap:8px}
button,a.btn{font:inherit;font-size:.86rem;padding:8px 14px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;text-decoration:none;transition:.15s}
button:hover,a.btn:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac);flex:1;font-weight:600}
button.pri:hover{filter:brightness(1.08)}
button.del{color:var(--ac)}
button.del.sure{background:var(--ac);color:#fff}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:48px 10px}
.empty big{display:block;font-size:2.4rem;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
#mod{position:fixed;inset:0;background:rgba(10,10,10,.75);display:none;flex-direction:column;z-index:20;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#mod.on{display:flex}
#bar{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
#bar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#fr{flex:1;border:0;background:#fff;width:100%}
#pg canvas{display:block;margin:0 auto 14px;max-width:100%;height:auto;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#st{color:#fff;text-align:center;padding:30px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;align-items:center}
.chipw{display:inline-flex;align-items:center;gap:4px}
.chip{border-radius:999px;padding:6px 14px;font-size:.85rem;background:var(--card)}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chip.add{border-style:dashed;color:var(--mut)}
.chipx{border:0;padding:4px 6px;font-size:.78rem;color:var(--ac);background:transparent}
.newcat{font:inherit;font-size:.85rem;padding:6px 12px;border:1px solid var(--ac);border-radius:999px;background:var(--card);color:var(--tx);outline:0}
.catsel{font:inherit;font-size:.82rem;padding:7px 10px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx)}
.star{border:0;padding:2px 6px;font-size:1.25rem;color:var(--mut);background:transparent}
.star.on{color:#f5b301}
.tools button{box-shadow:var(--sh);background:var(--card);padding:10px 14px;border-radius:12px}
footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:28px;padding-top:16px;border-top:1px solid var(--bd);color:var(--mut);font-size:.82rem}
footer .sp{flex:1}
body.list #grid{grid-template-columns:1fr}
body.list .item{flex-direction:row;align-items:center;flex-wrap:wrap}
body.list .top{flex:1;min-width:200px}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.28;will-change:transform}
.bgfx i:nth-child(1){width:46vmax;height:46vmax;background:var(--ac);left:-12vmax;top:-14vmax;animation:fl1 22s ease-in-out infinite alternate}
.bgfx i:nth-child(2){width:40vmax;height:40vmax;background:var(--ac2);right:-14vmax;top:18vh;animation:fl2 27s ease-in-out infinite alternate}
.bgfx i:nth-child(3){width:34vmax;height:34vmax;background:var(--ac);left:22vw;bottom:-18vmax;opacity:.18;animation:fl3 31s ease-in-out infinite alternate}
.bgfx:after{content:"";position:absolute;inset:-60px;background-image:radial-gradient(var(--mut) 1px,transparent 1.2px);background-size:34px 34px;opacity:.14;animation:drift 40s linear infinite}
@keyframes fl1{to{transform:translate(18vw,14vh) scale(1.15)}}
@keyframes fl2{to{transform:translate(-16vw,-10vh) scale(.9)}}
@keyframes fl3{to{transform:translate(-14vw,-16vh) scale(1.2)}}
@keyframes drift{to{transform:translate(34px,34px)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bgfx i{opacity:.2}}
:root[data-theme="dark"] .bgfx i{opacity:.2}
@media (prefers-reduced-motion:reduce){.bgfx i,.bgfx:after{animation:none}}
@media (max-width:520px){h1{font-size:1.3rem}.stats{flex-wrap:wrap}}
</style>
<style>
/* ===== UI polish ===== */
main{max-width:1040px;padding-top:44px}
header{flex-direction:column;text-align:center;gap:12px;margin-bottom:26px}
.logo{width:68px;height:68px;border-radius:22px;box-shadow:0 10px 30px color-mix(in srgb,var(--ac) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.logo svg{width:38px;height:38px}
h1{font-size:clamp(1.9rem,5vw,2.7rem);letter-spacing:-.02em;font-weight:700;background:linear-gradient(95deg,var(--tx) 30%,var(--ac) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 span{-webkit-text-fill-color:var(--mut)}
.sub{font-size:1.02rem;max-width:520px;margin:6px auto 0}
.stats{justify-content:center;gap:14px;margin-bottom:22px}
.stat{min-width:140px;text-align:center;padding:14px 22px;border-radius:18px;background:color-mix(in srgb,var(--card) 72%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.stat b{font-size:1.5rem;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
#drop{padding:42px 20px;border-radius:26px;border:2px dashed color-mix(in srgb,var(--ac) 45%,var(--bd));background:linear-gradient(145deg,color-mix(in srgb,var(--card) 80%,transparent),color-mix(in srgb,var(--soft) 70%,transparent));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#drop:hover,#drop.over{transform:translateY(-2px);border-color:var(--ac);box-shadow:0 14px 40px color-mix(in srgb,var(--ac) 22%,transparent)}
#drop .up{width:64px;height:64px;font-size:1.7rem;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 8px 22px color-mix(in srgb,var(--ac) 40%,transparent);animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{50%{transform:translateY(-4px)}}
#drop b{font-size:1.12rem}
.tools input,.tools select,.tools button{border-radius:14px;background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tools input:focus,.tools select:focus,.newcat:focus{outline:2px solid color-mix(in srgb,var(--ac) 55%,transparent);outline-offset:1px}
.chip{background:color-mix(in srgb,var(--card) 80%,transparent);font-weight:500}
.chip.on{background:linear-gradient(95deg,var(--ac),var(--ac2));border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 30%,transparent)}
.item{position:relative;overflow:hidden;border-radius:20px;padding:18px;background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:transform .2s,box-shadow .2s,border-color .2s}
.item:before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--ac),var(--ac2));opacity:.85}
.item:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--ac) 40%,var(--bd));box-shadow:0 16px 40px color-mix(in srgb,var(--ac) 16%,transparent)}
.ico{width:48px;height:58px;border-radius:10px;box-shadow:0 6px 14px color-mix(in srgb,var(--ac) 30%,transparent)}
.name{font-size:1rem}
button.pri{background:linear-gradient(95deg,var(--ac),var(--ac2));border:0;box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 28%,transparent)}
button:active{transform:scale(.97)}
button:focus-visible,a.btn:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.catsel{background:color-mix(in srgb,var(--soft) 60%,transparent);border-radius:12px}
footer{border-top-color:color-mix(in srgb,var(--bd) 70%,transparent)}
#mod{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#bar{background:color-mix(in srgb,var(--card) 92%,transparent)}
#toast{border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
@media (max-width:520px){main{padding:28px 14px 56px}.stat{min-width:0;flex:1;padding:12px}#drop{padding:34px 14px}}
@media (prefers-reduced-motion:reduce){#drop .up{animation:none}.item,#drop{transition:none}}
.cb{width:18px;height:18px;accent-color:var(--ac);flex:none;cursor:pointer}
.ico.th{width:52px;height:68px;background-size:cover;background-position:top;border:1px solid var(--bd)}
.ico.th:before,.ico.th:after{display:none}
#bulk{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:94vw;padding:10px 14px;border-radius:18px;background:var(--card);border:1px solid var(--bd);box-shadow:0 14px 40px rgba(0,0,0,.28);z-index:25}
#bulk.on{display:flex}
#bulk.on~#toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
#bn{font-weight:600;font-size:.9rem}
#bulk select{font:inherit;font-size:.85rem;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx)}
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <header>
    <div class="logo"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="5" width="5" height="15" rx="1.5" fill="#fff"/><rect x="10" y="3" width="5" height="17" rx="1.5" fill="#fff" opacity=".7"/><rect x="17" y="7" width="7" height="13" rx="1.5" fill="#fff"/><rect x="2" y="22" width="24" height="2.5" rx="1.25" fill="#fff"/></svg></div>
    <div><h1>DocShelf <span style="font-weight:500;color:var(--mut)">· ชั้นเอกสาร</span></h1><p class="sub">จัดเก็บ ค้นหา และอ่านเอกสารของคุณไว้ในที่เดียว</p></div>
  </header>
  <div class="stats">
    <div class="stat"><b id="sc">0</b><span>ไฟล์ทั้งหมด</span></div>
    <div class="stat"><b id="ss">0 KB</b><span>พื้นที่ที่ใช้</span></div>
  </div>
  <div id="drop">
    <div class="up">⬆</div>
    <b id="dt">คลิกเพื่อเลือกไฟล์ หรือลากไฟล์ PDF มาวาง</b>
    <small>อัปโหลดได้หลายไฟล์พร้อมกัน · ไฟล์จะเข้าหมวดที่เลือกอยู่ · เก็บในเบราว์เซอร์ ไม่ต้องใช้อินเทอร์เน็ต</small>
    <div id="bar2"><i></i></div>
    <input id="file" type="file" accept="application/pdf,.pdf" multiple aria-label="เลือกไฟล์ PDF">
  </div>
    <div class="tools">
    <input id="q" type="search" placeholder="🔍 ค้นหาชื่อไฟล์…">
    <select id="sort" aria-label="เรียงลำดับ">
      <option value="new">ใหม่สุดก่อน</option>
      <option value="old">เก่าสุดก่อน</option>
      <option value="name">ชื่อ ก–ฮ / A–Z</option>
      <option value="size">ขนาดใหญ่สุด</option>
    </select>
    <button id="vw" title="สลับมุมมอง">☰</button><button id="th" title="สลับโหมดสว่าง/มืด">🌓</button>

</main>
<div id="bulk"><span id="bn"></span><select id="bc" aria-label="ย้ายหมวด"></select><button id="ba">เลือกทั้งหมด</button><button id="bd" class="del">ลบ</button><button id="bx">ยกเลิก</button></div>
<div id="toast"></div>
<div id="mod"><div id="bar"><span id="mt"></span><a id="mo" class="btn" target="_blank" rel="noopener">แท็บใหม่</a><a id="md" class="btn" download>ดาวน์โหลด</a><button id="mc">ปิด ✕</button></div><iframe id="fr" title="ตัวอ่านเอกสาร"></iframe></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" async onload="window.genThumbs&&genThumbs()"></script>
<script>
let vis=[],items=[],cats=[],filt="__all",adding=false,cur=null,tt,curUrl=null,D;
const $=id=>document.getElementById(id);
const fmt=b=>b>1073741824?(b/1073741824).toFixed(1)+" GB":b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),3200)}
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("pdf-library",2);
  r.onupgradeneeded=e=>{const d=r.result;if(e.oldVersion<1){d.createObjectStore("meta",{keyPath:"id"});d.createObjectStore("blobs")}if(e.oldVersion<2)d.createObjectStore("cats",{keyPath:"name"})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const store=(n,m="readonly")=>D.transaction(n,m).objectStore(n);
async function load(){items=await req(store("meta").getAll());cats=(await req(store("cats").getAll())).sort((a,b)=>a.name.localeCompare(b.name,"th"));render();updateUsage();genThumbs()}
function render(){
  for(const id of [...picked])if(!items.some(i=>i.id===id))picked.delete(id);bulk();
  $("sc").textContent=items.length;
  $("ss").textContent=fmt(items.reduce((s,i)=>s+(i.size||0),0));
  const q=$("q").value.trim().toLowerCase(),s=$("sort").value;
  chips();
  const inCat=i=>filt==="__all"||(filt==="__fav"?!!i.fav:filt==="__none"?(!i.cat||!cats.some(k=>k.name===i.cat)):i.cat===filt);
  const rows=items.filter(i=>inCat(i)&&i.name.toLowerCase().includes(q));
  rows.sort((a,b)=>s==="old"?a.added-b.added:s==="name"?a.name.localeCompare(b.name,"th"):s==="size"?b.size-a.size:b.added-a.added);
  vis=rows;const G=$("grid");G.textContent="";
  if(!rows.length){
    const d=document.createElement("div");d.className="empty";
    const b=document.createElement("big");b.textContent=items.length?"🔎":"📂";
    d.append(b,items.length?"ไม่พบไฟล์ที่ค้นหา":"ยังไม่มีไฟล์ — อัปโหลดไฟล์แรกได้เลย");
    G.append(d);return;
  }
  for(const i of rows){
    const c=document.createElement("div");c.className="item";
    const top=document.createElement("div");top.className="top";
    const ic=document.createElement("div");ic.className="ico";ic.textContent="";if(i.thumb){ic.style.backgroundImage="url("+i.thumb+")";ic.classList.add("th")}
    const inf=document.createElement("div");inf.className="info";
    const n=document.createElement("div");n.className="name";n.textContent=i.name;n.title=i.name;
    const m=document.createElement("div");m.className="meta";
    m.textContent=fmt(i.size)+(i.pages?" · "+i.pages+" หน้า":"")+" · "+new Date(i.added).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"});
    inf.append(n,m);
    const star=document.createElement("button");star.className="star"+(i.fav?" on":"");star.textContent=i.fav?"★":"☆";star.title="รายการโปรด";star.onclick=()=>toggleFav(i);
    const cb=document.createElement("input");cb.type="checkbox";cb.className="cb";cb.checked=picked.has(i.id);cb.title="เลือก";
    cb.onchange=()=>{cb.checked?picked.add(i.id):picked.delete(i.id);bulk()};
    top.append(cb,ic,inf,star);
    const a=document.createElement("div");a.className="acts";
    const o=document.createElement("button");o.className="pri";o.textContent="เปิดอ่าน";o.onclick=()=>view(i);
    const x=document.createElement("button");x.className="del";x.textContent="ลบ";
    x.onclick=()=>{
      if(x.dataset.c){remove(i)}
      else{x.dataset.c="1";x.textContent="ยืนยันลบ?";x.classList.add("sure");
        setTimeout(()=>{x.dataset.c="";x.textContent="ลบ";x.classList.remove("sure")},3000)}
    };
    const sel=document.createElement("select");sel.className="catsel";sel.title="หมวดหมู่";
    sel.append(new Option("ไม่มีหมวด",""));for(const k of cats)sel.append(new Option(k.name,k.name));sel.value=i.cat||"";
    sel.onchange=()=>setCat(i,sel.value);
    const rn=document.createElement("button");rn.textContent="✎";rn.title="เปลี่ยนชื่อ";rn.onclick=()=>renameInline(i,n);
    const dlb=document.createElement("button");dlb.textContent="⤓";dlb.title="ดาวน์โหลด";dlb.onclick=()=>downloadItem(i);
    a.append(o,dlb,rn,x);c.append(top,sel,a);G.append(c);
  }
}
async function toggleFav(i){try{await req(store("meta","readwrite").put({...i,fav:!i.fav}));await load()}catch(e){toast("บันทึกไม่สำเร็จ")}}
function renameInline(i,n){
  const inp=document.createElement("input");inp.className="newcat";inp.style.cssText="width:100%;border-radius:8px";inp.value=i.name;
  n.replaceWith(inp);inp.focus();inp.select();let done=false;
  const fin=async ok=>{if(done)return;done=true;const v=inp.value.trim();
    if(ok&&v&&v!==i.name){try{await req(store("meta","readwrite").put({...i,name:v}));toast("เปลี่ยนชื่อแล้ว")}catch(e){toast("เปลี่ยนชื่อไม่สำเร็จ")}}
    await load()};
  inp.onkeydown=e=>{if(e.key==="Enter")fin(true);if(e.key==="Escape")fin(false)};inp.onblur=()=>fin(true);
}
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function setView(v){document.body.classList.toggle("list",v==="list");$("vw").textContent=v==="list"?"▦":"☰";LS.set("ds-view",v)}
$("vw").onclick=()=>setView(document.body.classList.contains("list")?"grid":"list");
setView(LS.get("ds-view")==="list"?"list":"grid");
function setTheme(t){document.documentElement.dataset.theme=t;LS.set("ds-theme",t)}
$("th").onclick=()=>{const d=document.documentElement.dataset.theme;const dark=d?d==="dark":matchMedia("(prefers-color-scheme:dark)").matches;setTheme(dark?"light":"dark")};
if(LS.get("ds-theme"))setTheme(LS.get("ds-theme"));
async function updateUsage(){try{const e=await navigator.storage.estimate();$("usage").textContent="พื้นที่ในเบราว์เซอร์: ใช้ "+fmt(e.usage)+(e.quota?" จาก "+fmt(e.quota):"")}catch(x){}}
const b64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
$("bk").onclick=async()=>{
  if(!items.length){toast("ยังไม่มีไฟล์ให้สำรอง");return}
  toast("กำลังสร้างไฟล์สำรอง…");
  try{
    const files=[];
    for(const i of items){const b=await req(store("blobs").get(i.id));files.push({...i,data:await b64(b)})}
    const blob=new Blob([JSON.stringify({app:"docshelf",v:1,cats,files})],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="docshelf-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("สร้างไฟล์สำรองแล้ว");
  }catch(e){toast("สำรองไม่สำเร็จ: "+(e&&e.message||e))}
};
$("rs").onclick=()=>$("rf").click();
$("rf").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const d=JSON.parse(await f.text());if(d.app!=="docshelf")throw new Error("ไม่ใช่ไฟล์สำรองของ DocShelf");
    for(const k of d.cats||[])await req(store("cats","readwrite").put({name:k.name}));
    let n=0;
    for(const x of d.files||[]){const {data,...m}=x;const b=await (await fetch(data)).blob();
      await req(store("blobs","readwrite").put(b,m.id));await req(store("meta","readwrite").put(m));n++}
    await load();toast("กู้คืน "+n+" ไฟล์แล้ว");
  }catch(err){toast("กู้คืนไม่สำเร็จ: "+(err&&err.message||err))}
};
const picked=new Set();let gt=false;
function bulk(){
  const n=picked.size;$("bulk").classList.toggle("on",n>0);$("bn").textContent="เลือก "+n+" ไฟล์";
  const c=$("bc");c.textContent="";c.append(new Option("ย้ายไปหมวด…","__"),new Option("ไม่มีหมวด",""));for(const k of cats)c.append(new Option(k.name,k.name));
  const d=$("bd");if(!d.dataset.c)d.textContent="ลบ";
}
$("bc").onchange=async()=>{
  const v=$("bc").value;if(v==="__")return;
  try{for(const i of items.filter(i=>picked.has(i.id)))await req(store("meta","readwrite").put({...i,cat:v}));
    toast("ย้าย "+picked.size+" ไฟล์แล้ว");picked.clear();await load()}catch(e){toast("ย้ายไม่สำเร็จ")}
};
$("ba").onclick=()=>{vis.forEach(i=>picked.add(i.id));render()};
$("bx").onclick=()=>{picked.clear();render()};
$("bd").onclick=async()=>{
  const d=$("bd");
  if(!d.dataset.c){d.dataset.c="1";d.textContent="ยืนยันลบ "+picked.size+" ไฟล์?";setTimeout(()=>{d.dataset.c="";bulk()},3000);return}
  d.dataset.c="";const ids=[...picked];
  try{for(const id of ids){await req(store("meta","readwrite").delete(id));await req(store("blobs","readwrite").delete(id))}
    toast("ลบ "+ids.length+" ไฟล์แล้ว");picked.clear();await load()}catch(e){toast("ลบไม่สำเร็จ")}
};
async function downloadItem(i){
  try{const b=await req(store("blobs").get(i.id));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([b],{type:"application/pdf"}));
    a.download=/\.pdf$/i.test(i.name)?i.name:i.name+".pdf";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch(e){toast("ดาวน์โหลดไม่สำเร็จ")}
}
async function genThumbs(){
  if(gt||!window.pdfjsLib||!D)return;
  const todo=items.filter(i=>!i.thumb&&!i.nt);if(!todo.length)return;gt=true;
  try{
    pdfjsLib.disableWorker=true;pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    for(const i of todo){
      try{
        const b=await req(store("blobs").get(i.id));
        const doc=await pdfjsLib.getDocument({data:await b.arrayBuffer()}).promise;
        const pg=await doc.getPage(1);const vp=pg.getViewport({scale:160/pg.getViewport({scale:1}).width});
        const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
        await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
        await req(store("meta","readwrite").put({...i,thumb:c.toDataURL("image/jpeg",.7),pages:doc.numPages}));
      }catch(e){await req(store("meta","readwrite").put({...i,nt:1}))}
    }
  }catch(e){}
  gt=false;await load();
}
function chips(){
  const C=$("chips");const old=C.querySelector("input");if(old)old.onblur=null;C.textContent="";
  const mk=(label,key,n)=>{const b=document.createElement("button");b.className="chip"+(filt===key?" on":"");b.textContent=label+" · "+n;b.onclick=()=>{filt=key;render()};return b};
  C.append(mk("ทั้งหมด","__all",items.length));
  if(filt==="__fav"||items.some(i=>i.fav))C.append(mk("★ โปรด","__fav",items.filter(i=>i.fav).length));
  for(const k of cats){
    const w=document.createElement("span");w.className="chipw";
    w.append(mk(k.name,k.name,items.filter(i=>i.cat===k.name).length));
    if(filt===k.name){const x=document.createElement("button");x.className="chipx";x.textContent="✕";x.title="ลบหมวดนี้ (ไฟล์ไม่ถูกลบ)";
      x.onclick=()=>{if(x.dataset.c){delCat(k.name)}else{x.dataset.c="1";x.textContent="ลบหมวด?";setTimeout(()=>{x.dataset.c="";x.textContent="✕"},3000)}};w.append(x)}
    C.append(w);
  }
  const u=items.filter(i=>!i.cat||!cats.some(k=>k.name===i.cat)).length;
  if(cats.length&&u)C.append(mk("ไม่มีหมวด","__none",u));
  if(adding){const inp=document.createElement("input");inp.className="newcat";inp.placeholder="ชื่อหมวด แล้วกด Enter";inp.maxLength=30;
    inp.onkeydown=e=>{if(e.key==="Enter")addCat(inp.value);if(e.key==="Escape"){adding=false;chips()}};
    inp.onblur=()=>{if(!inp.value.trim()){adding=false;chips()}};C.append(inp);setTimeout(()=>inp.focus());}
  else{const p=document.createElement("button");p.className="chip add";p.textContent="+ หมวดใหม่";p.onclick=()=>{adding=true;chips()};C.append(p)}
}
async function setCat(i,v){try{await req(store("meta","readwrite").put({...i,cat:v}));await load()}catch(e){toast("ย้ายหมวดไม่สำเร็จ")}}
async function addCat(v){
  const name=v.trim();if(!name)return;
  if(cats.some(k=>k.name===name)){toast("มีหมวดนี้แล้ว");return}
  try{await req(store("cats","readwrite").put({name}));adding=false;filt=name;await load();toast("เพิ่มหมวด "+name+" แล้ว")}catch(e){toast("เพิ่มหมวดไม่สำเร็จ")}
}
async function delCat(name){
  try{
    await req(store("cats","readwrite").delete(name));
    for(const i of items.filter(i=>i.cat===name))await req(store("meta","readwrite").put({...i,cat:""}));
    filt="__all";await load();toast("ลบหมวด "+name+" แล้ว ไฟล์ยังอยู่ครบ");
  }catch(e){toast("ลบหมวดไม่สำเร็จ")}
}
async function upload(files){
  $("bar2").style.display="block";let ok=0;
  for(const f of files){
    if(f.type!=="application/pdf"&&!/\.pdf$/i.test(f.name)){toast("ข้าม "+f.name+" (ไม่ใช่ PDF)");continue}
    try{
      const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      await req(store("blobs","readwrite").put(f,id));
      await req(store("meta","readwrite").put({id,name:f.name,size:f.size,added:Date.now(),cat:(filt!=="__all"&&filt!=="__none"&&filt!=="__fav")?filt:""}));
      ok++;
    }catch(e){toast("บันทึกไม่สำเร็จ: "+(e&&e.message||e))}
  }
  $("bar2").style.display="none";
  if(ok){toast("อัปโหลดสำเร็จ "+ok+" ไฟล์");await load()}
}
async function remove(i){
  try{await req(store("meta","readwrite").delete(i.id));await req(store("blobs","readwrite").delete(i.id));toast("ลบแล้ว: "+i.name);await load()}
  catch(e){toast("ลบไม่สำเร็จ: "+(e&&e.message||e))}
}
async function view(i){
  try{
    const b=await req(store("blobs").get(i.id));if(!b)throw new Error("ไม่พบไฟล์");
    if(curUrl)URL.revokeObjectURL(curUrl);
    curUrl=URL.createObjectURL(new Blob([b],{type:"application/pdf"}));cur=i;
    $("mt").textContent=i.name;$("mo").href=curUrl;$("md").href=curUrl;$("md").download=/\.pdf$/i.test(i.name)?i.name:i.name+".pdf";
    $("fr").src=curUrl;$("mod").classList.add("on");
  }catch(e){toast("เปิดไม่ได้: "+(e&&e.message||e))}
}
function closeView(){$("mod").classList.remove("on");cur=null;$("fr").src="about:blank"}
$("mc").onclick=closeView;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&cur)closeView()});
const drop=$("drop");
if(matchMedia("(pointer:coarse)").matches)$("dt").textContent="แตะเพื่อเลือกไฟล์ PDF จากเครื่อง";
$("file").onchange=e=>{upload([...e.target.files]);e.target.value=""};
drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")};
drop.ondragleave=()=>drop.classList.remove("over");
drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");upload([...e.dataTransfer.files])};
$("q").oninput=render;$("sort").onchange=render;
(async()=>{
  try{D=await openDB();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();await load()}
  catch(e){render();toast("เบราว์เซอร์นี้ไม่รองรับการเก็บไฟล์")}
})();
</script>
</body>
